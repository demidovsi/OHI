<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ title }}</title>
    <link rel="shortcut icon" href="/static/star_david.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #14161a;
            color: #e8e8e8;
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }
        .box {
            max-width: 480px;
            padding: 32px 36px;
            border-radius: 12px;
            background: #1e2128;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .code {
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.5;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 14px;
        }
        p {
            line-height: 1.5;
            opacity: 0.85;
            margin: 0 0 22px;
        }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a.btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
        }
        a.btn-primary {
            background: #3a7bd5;
            color: white;
        }
        a.btn-secondary {
            background: transparent;
            color: #e8e8e8;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">Ошибка {{ code }}</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="actions">
            {% if back_url %}
                <a class="btn btn-primary" href="{{ back_url }}">Вернуться назад</a>
            {% endif %}
            <a class="btn btn-secondary" href="/">На главную</a>
        </div>
    </div>
</body>
</html>
