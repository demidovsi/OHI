<!doctype html>
<html lang="ru" data-theme="{{upr['select_theme']}}">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="author" content="Демидов Сергей">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.25/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" type="text/css" href="/static/css/base.css">
    <link rel="shortcut icon" href="/static/star_david.png" >

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
          integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
          crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
          integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
          crossorigin="anonymous"></script>
  <script type="text/javascript" charset="utf8"
          src="/static/js/jquery.dataTables.js"></script>
    <!--            src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.js"></script>-->
  <script type="text/javascript" charset="utf8"
          src="https://cdn.datatables.net/1.10.25/js/dataTables.bootstrap5.js"></script>

    <title>{% block title %} {% endblock %}</title>
  </head>
  <body class="main" data-theme="{{upr['select_theme']}}" data-user-id="{{upr['user_id']}}"
        style="background: var(--color-background, {{colors['background']}}); color: var(--color-black, {{colors['black']}});">
      <basefont size="5">
          <div class="menu">
              <input type="hidden" name="user_id" value="{{upr['user_id']}}">
              <input type="hidden" name="own" value="{{own}}">
              {% include "include/menu2.html" %}
          </div>
          <div class="container-flash">
                <!-- вывести все ошибки анализа ввода -->
              {% for message in get_flashed_messages(with_categories=True) %}
              <div class="alert alert-{{ message[0] }}">
                  <button type="button" class="close" data-dismiss="alert">&times;</button>
                  {{ message[1] }}
              </div>
              {% endfor %}
          </div>
          <div class="container">
              {% block content %} {% endblock %}
          </div>
      </basefont>
  </body>
  <script>
      function choose_language() {
            document.forms['{{own}}'].submit();
        }
      function choose_theme() {
            document.forms['{{own}}'].submit();
        }
  </script>
  <!-- Мгновенное переключение цветовой темы на клиенте (без submit) - см.
       static/js/theme_switch.js. Переопределяет choose_theme() выше и
       добавляет toggle_theme() для кнопки в include/select_language.html. -->
  <script src="/static/js/theme_switch.js"></script>

  <!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
  {% block scripts %}
  {% endblock %}
</html>
